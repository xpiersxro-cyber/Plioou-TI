version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-plioou_user}:${POSTGRES_PASSWORD:-plioou_pass}@postgres:5432/${POSTGRES_DB:-plioou_db}}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: plioou_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plioou_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-plioou_db}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
